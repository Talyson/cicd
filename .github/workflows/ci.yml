name: CI/CD

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: cicd-demo

jobs:
  # ---------------------------------------------------------------
  # Gate 1: Lint e formatação
  # ---------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format
        run: ruff format --check .

  # ---------------------------------------------------------------
  # Gate 2: Testes + cobertura mínima (80%)
  # ---------------------------------------------------------------
  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (falha se cobertura < 80%)
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------
  # Gate 3: SAST - Bandit (falha em severidade HIGH)
  # ---------------------------------------------------------------
  sast-bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Relatório completo (SARIF)
        run: bandit -c pyproject.toml -r app -f sarif -o bandit.sarif --exit-zero
      - name: Enviar SARIF para Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Quality gate - sem achados HIGH
        run: bandit -c pyproject.toml -r app --severity-level high --confidence-level medium

  # ---------------------------------------------------------------
  # Gate 4: SAST - Semgrep (falha em severidade ERROR = high)
  # ---------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Relatório completo (SARIF)
        run: semgrep scan --config p/python --config p/flask --config p/secrets --sarif --output semgrep.sarif --metrics=off
      - name: Enviar SARIF para Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Quality gate - sem achados ERROR
        run: semgrep scan --config p/python --config p/flask --config p/secrets --severity ERROR --error --metrics=off

  # ---------------------------------------------------------------
  # Gate 5: SCA - dependências Python (pip-audit + Trivy fs)
  # ---------------------------------------------------------------
  sca-deps:
    name: SCA (dependências)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar pip-audit
        run: pip install pip-audit==2.10.1
      - name: pip-audit (falha em qualquer vulnerabilidade conhecida)
        run: pip-audit -r requirements.txt --strict --desc
      - name: Trivy fs - relatório SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
      - name: Enviar SARIF para Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Quality gate - sem CVEs HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # ---------------------------------------------------------------
  # Gate 6: Build da imagem + SCA da imagem (Trivy image)
  # ---------------------------------------------------------------
  build-image:
    name: Build e scan da imagem
    runs-on: ubuntu-latest
    needs: [test, sast-bandit, sast-semgrep, sca-deps]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
      - name: Trivy image - relatório SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/image.tar
          format: sarif
          output: trivy-image.sarif
      - name: Enviar SARIF para Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Quality gate - imagem sem CVEs HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ---------------------------------------------------------------
  # Portão agregador: marque este job como obrigatório na branch protection
  # ---------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, sast-bandit, sast-semgrep, sca-deps, build-image]
    steps:
      - name: Resumo dos gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Quality Gate"
            echo ""
            echo "| Gate | Resultado |"
            echo "|------|-----------|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(if .value.result == "success" then "✅" else "❌" end) \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Avaliar gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Quality gate reprovado. Jobs com falha: ${failed}"
            exit 1
          fi
          echo "Todos os gates aprovados."

  # ---------------------------------------------------------------
  # Deploy (somente push na main, após quality gate aprovado)
  # ---------------------------------------------------------------
  deploy:
    name: Publicar imagem (GHCR)
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag e push
        run: |
          docker load --input /tmp/image.tar
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REPO}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REPO}:latest"
          docker push "${REPO}:${GITHUB_SHA}"
          docker push "${REPO}:latest"
